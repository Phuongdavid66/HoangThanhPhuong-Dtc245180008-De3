services:
  # ========================================================
  # 1. Cơ sở dữ liệu MySQL (Chạy trong mạng nội bộ backend)
  # ========================================================
  db:
    image: mysql:8.0
    container_name: wp_mysql
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - backend_net
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ========================================================
  # 2. Ứng dụng Web WordPress
  # ========================================================
  wordpress:
    image: wordpress:latest
    container_name: wp_app
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    depends_on:
      db:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${MYSQL_DATABASE}
      WORDPRESS_DB_USER: ${MYSQL_USER}
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD}
      WORDPRESS_CONFIG_EXTRA: |
        if (isset($$_SERVER['HTTP_X_FORWARDED_PROTO']) && strpos($$_SERVER['HTTP_X_FORWARDED_PROTO'], 'https') !== false) {
            $$_SERVER['HTTPS'] = 'on';
        }
    volumes:
      - wp_data:/var/www/html
    networks:
      - frontend_net
      - backend_net

  # ========================================================
  # 3. Công cụ quản lý cơ sở dữ liệu phpMyAdmin
  # ========================================================
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: wp_phpmyadmin
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    depends_on:
      db:
        condition: service_healthy
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      UPLOAD_LIMIT: 64M
    ports:
      - "8081:80"
    networks:
      - backend_net

  # ========================================================
  # 4. Nginx Reverse Proxy (Cổng giao tiếp duy nhất ra ngoài cho Web)
  # ========================================================
  nginx:
    image: nginx:alpine
    container_name: wp_nginx
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    depends_on:
      - wordpress
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    networks:
      - frontend_net

  # ========================================================
  # 5. cAdvisor - Giám sát Container (CPU, Memory, IO)
  # ========================================================
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.47.2
    container_name: wp_cadvisor
    restart: unless-stopped
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks:
      - monitoring_net

  # ========================================================
  # 6. Nginx Prometheus Exporter - Giám sát Web Server
  # ========================================================
  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.1.0
    container_name: wp_nginx_exporter
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    depends_on:
      - nginx
    command:
      - -nginx.scrape-uri=http://nginx:8080/stub_status
    networks:
      - frontend_net
      - monitoring_net

  # ========================================================
  # 7. MySQL Exporter - Giám sát Cơ sở dữ liệu
  # ========================================================
  mysqld-exporter:
    image: prom/mysqld-exporter:latest
    container_name: wp_mysqld_exporter
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    depends_on:
      db:
        condition: service_healthy
    command:
      - --config.my-cnf=/.my.cnf
    volumes:
      - ./mysqld-exporter/.my.cnf:/.my.cnf:ro
    networks:
      - backend_net
      - monitoring_net

  # ========================================================
  # 8. Prometheus Server - Thu thập và lưu trữ Metrics
  # ========================================================
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: wp_prometheus
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    networks:
      - monitoring_net

  # ========================================================
  # 9. Grafana - Hiển thị Dashboard & Truy vấn LogQL
  # ========================================================
  grafana:
    image: grafana/grafana:10.4.1
    container_name: wp_grafana
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    depends_on:
      - prometheus
      - loki
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=Admin_S3cur3d#2026!
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - monitoring_net

  # ========================================================
  # 10. Loki - Hệ thống Lưu trữ Log tập trung
  # ========================================================
  loki:
    image: grafana/loki:2.9.8
    container_name: wp_loki
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "3100:3100"
    volumes:
      - ./loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - monitoring_net

  # ========================================================
  # 11. Promtail - Thu thập và đẩy Log các Container vào Loki
  # ========================================================
  promtail:
    image: grafana/promtail:2.9.8
    container_name: wp_promtail
    restart: unless-stopped
    depends_on:
      - loki
    volumes:
      - ./promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    command: -config.file=/etc/promtail/config.yml
    networks:
      - monitoring_net

# ========================================================
# Cấu hình Mạng (Network Isolation - Hardening Tiêu chí 6)
# ========================================================
networks:
  frontend_net:
    driver: bridge
  backend_net:
    driver: bridge
  monitoring_net:
    driver: bridge

# ========================================================
# Lưu trữ dữ liệu bền vững (Persistent Volumes)
# ========================================================
volumes:
  db_data:
  wp_data:
  prometheus_data:
  grafana_data:
  loki_data:
