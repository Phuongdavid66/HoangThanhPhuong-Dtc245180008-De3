# ========================================================
# CẤU HÌNH NGINX REVERSE PROXY CHO WORDPRESS
# ========================================================

# 1. Cấu hình HTTP (Port 80) - Tự động chuyển hướng sang HTTPS
server {
    listen 80;
    server_name localhost;

    # Security Headers cơ bản trên HTTP
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Chuyển hướng toàn bộ lưu lượng HTTP sang HTTPS (Bảo mật Hardening)
    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. Cấu hình HTTPS (Port 443) - Reverse Proxy vào WordPress
server {
    listen 443 ssl;
    server_name localhost;

    # Chứng chỉ SSL tự ký (Self-signed Certificate)
    ssl_certificate /etc/nginx/ssl/nginx.crt;
    ssl_certificate_key /etc/nginx/ssl/nginx.key;

    # Cấu hình giao thức và thuật toán mã hóa (Hardening SSL)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security Headers (Tiêu chí 3 & Tiêu chí 6 Hardening)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Dung lượng tối đa file tải lên (hỗ trợ upload media trên WordPress)
    client_max_body_size 64M;

    # Chuyển tiếp request tới container WordPress
    location / {
        proxy_pass http://wordpress:80;
        proxy_http_version 1.1;

        # Headers chuyển tiếp để WordPress nhận diện chính xác client và HTTPS
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;

        # Buffer và Timeout tối ưu
        proxy_connect_timeout 90s;
        proxy_send_timeout 90s;
        proxy_read_timeout 90s;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }
}

# 3. Cấu hình Metrics nội bộ cho Prometheus Exporter (Port 8080)
server {
    listen 8080;
    server_name localhost;

    location /stub_status {
        stub_status on;
        access_log off;
        allow all;
    }
}

